# Lock screen. Gruvbox Dark Hard, matching programs.ghostty and
# programs.starship in home.nix.
#
# Invoked by hypridle's lock_cmd (see hypridle.conf), which in turn answers the
# logind lock signal raised by SUPER+Escape, the 10m idle listener and
# before_sleep_cmd.

general {
    hide_cursor = true
    grace = 0
    no_fade_in = false
    ignore_empty_input = true
}

# Solid background. Switch `color` for `path = ...` once a wallpaper is
# committed to the repo and wired up via services.hyprpaper.
background {
    monitor =
    color = rgba(1d2021ff)
    blur_passes = 0
}

# Clock
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(ebdbb2ff)
    font_size = 96
    font_family = JetBrainsMono Nerd Font ExtraBold
    position = 0, 240
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = rgba(a89984ff)
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    position = 0, 160
    halign = center
    valign = center
}

# User
label {
    monitor =
    text =    $USER
    color = rgba(83a598ff)
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = 0, 60
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 52
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true

    outer_color = rgba(458588ff)
    inner_color = rgba(282828ff)
    font_color = rgba(ebdbb2ff)
    check_color = rgba(d79921ff)
    fail_color = rgba(cc241dff)

    font_family = JetBrainsMono Nerd Font
    placeholder_text = <span foreground="##928374">Password</span>
    fail_text = <span foreground="##fb4934">$FAIL ($ATTEMPTS)</span>

    fade_on_empty = false
    rounding = 8

    position = 0, -20
    halign = center
    valign = center
}
