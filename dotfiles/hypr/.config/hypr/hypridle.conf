# Idle daemon. Started as a systemd user unit by home-manager
# (services.hypridle.enable), bound to graphical-session.target.
#
# Locking always goes through logind rather than calling hyprlock directly, so
# the SUPER+Escape bind, the idle listener below and before_sleep_cmd all
# trigger the same lock_cmd.

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
    ignore_dbus_inhibit = false
}

listener {
    timeout = 290      # 4m50s — warn just before the screen goes dark
    on-timeout = notify-send -u low "Screen turning off"
    on-resume = notify-send -u low "Welcome back"
}

listener {
    timeout = 300      # 5m — screen off
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

listener {
    timeout = 600      # 10m — lock
    on-timeout = loginctl lock-session
}

listener {
    timeout = 1800     # 30m — suspend (locked first, via before_sleep_cmd)
    on-timeout = systemctl suspend
}
