# Idle daemon. Started as a systemd user unit by home-manager
# (services.hypridle.enable), bound to graphical-session.target.
#
# Locking always goes through logind rather than calling hyprlock directly, so
# the SUPER+Escape bind, the idle listener below and before_sleep_cmd all
# trigger the same lock_cmd.

# DELIBERATELY NO `listener` BLOCKS. Nothing here is on a timer, so the machine
# never blanks, locks, suspends or hibernates on its own. The only thing that
# puts it to sleep is closing the lid, which logind handles
# (HandleLidSwitch=suspend), not this daemon.
#
# hypridle stays ENABLED rather than being switched off, because `general`
# below is what locks the session BEFORE that lid-close suspend. Disabling it
# would mean waking from a lid-close to an unlocked desktop.
#
# It logs `[ERR] Config has errors: No rules configured / Proceeding ignoring
# faulty entries` at startup. That is expected and harmless - verified: the
# daemon stays up and the sleep hooks still fire.
#
# To bring idle behaviour back, add listeners here, e.g.
#   listener { timeout = 300  on-timeout = hyprctl dispatch dpms off
#                             on-resume  = hyprctl dispatch dpms on }
#   listener { timeout = 600  on-timeout = loginctl lock-session }
#   listener { timeout = 1800 on-timeout = systemctl suspend }

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
    ignore_dbus_inhibit = false
}
